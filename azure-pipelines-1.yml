trigger: none

pool:
  name: Prod_infra  # Self-hosted agent

steps:

# Check and install Java manually if needed
- task: PowerShell@2
  displayName: 'Ensure Java is installed'
  inputs:
    targetType: 'inline'
    script: |
      if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
          Write-Host "Java not found. Installing OpenJDK 11..."
          # Example: download and extract OpenJDK 11 to a local folder
          $jdkUrl = "https://download.java.net/java/GA/jdk11/13/GPL/openjdk-11_windows-x64_bin.zip"
          $jdkZip = "$(System.DefaultWorkingDirectory)\jdk11.zip"
          Invoke-WebRequest -Uri $jdkUrl -OutFile $jdkZip
          Expand-Archive -Path $jdkZip -DestinationPath "$(System.DefaultWorkingDirectory)\jdk11"
          setx JAVA_HOME "$(System.DefaultWorkingDirectory)\jdk11\jdk-11"
          setx PATH "$env:JAVA_HOME\bin;$env:PATH"
      }
      java -version

# Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js 18.x'
  inputs:
    versionSpec: '18.x'

# Install npm dependencies
- task: PowerShell@2
  displayName: 'npm install'
  inputs:
    targetType: 'inline'
    script: |
      npm install

# Build the project
- task: PowerShell@2
  displayName: 'npm run build'
  inputs:
    targetType: 'inline'
    script: |
      npm run build

# Run SonarQube scan using CLI
- task: PowerShell@2
  displayName: 'Run SonarQube Scanner'
  inputs:
    targetType: 'inline'
    script: |
      # Set SonarQube environment variables
      $env:SONAR_HOST_URL="http://your-sonarqube-server"
      $env:SONAR_LOGIN="YOUR_SONARQUBE_TOKEN"

      # Install SonarScanner globally if needed
      npm install -g sonar-scanner

      # Run scanner
      sonar-scanner -Dsonar.projectKey=apps -Dsonar.sources=. -Dsonar.projectName=apps

# Archive the build folder
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/build/'
    includeRootFolder: true
    archiveType: 'zip'
    archiveFile: '$(System.DefaultWorkingDirectory)/build.zip'
    replaceExistingArchive: true

# Publish the artifact
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/build.zip'
    artifact: 'todo-ui'
    publishLocation: 'pipeline'
