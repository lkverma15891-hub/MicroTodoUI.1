trigger: none

pool:
  name: Prod_infra

steps:

# Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '18.x'

# Install npm dependencies
- task: PowerShell@2
  displayName: 'npm install'
  inputs:
    targetType: 'inline'
    script: |
      npm install

# Build the project
- task: PowerShell@2
  displayName: 'npm run build'
  inputs:
    targetType: 'inline'
    script: |
      npm run build

# Run SonarQube scan using CLI
- task: PowerShell@2
  displayName: 'Run SonarQube Scanner'
  inputs:
    targetType: 'inline'
    script: |
      # Set SonarQube environment variables
      $env:SONAR_HOST_URL="http://your-sonarqube-server"
      $env:SONAR_LOGIN="YOUR_SONARQUBE_TOKEN"

      # Install SonarScanner globally if needed
      npm install -g sonar-scanner

      # Run scanner
      sonar-scanner -Dsonar.projectKey=apps -Dsonar.sources=. -Dsonar.projectName=apps

# Archive the build folder
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/build/'
    includeRootFolder: true
    archiveType: 'zip'
    archiveFile: '$(System.DefaultWorkingDirectory)/build.zip'
    replaceExistingArchive: true

# Publish the artifact
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/build.zip'
    artifact: 'todo-ui'
    publishLocation: 'pipeline'
