trigger: none

pool:
  name: Prod_infra

stages:

# ======================================================
# Stage 0: SAST Scan
# ======================================================
- stage: SAST_Scan
  displayName: "SAST - Security Scan"
  jobs:
  - job: SAST
    displayName: "Run SAST Scan"
    steps:

    - task: PowerShell@2
      displayName: "Run SAST using Sonar CLI"
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
      inputs:
        targetType: 'inline'
        script: |
          sonar -D sonar.host.url=http://localhost:9000 -D sonar.token=$env:SONAR_TOKEN -D sonar.projectKey=todouimonolathic

# ======================================================
# Stage 1: Code Quality Scan
# ======================================================
- stage: SonarQube_Scan
  displayName: "SonarQube Code Quality"
  dependsOn: SAST_Scan
  jobs:
  - job: SonarScan
    displayName: "Run Sonar Code Scan"
    steps:

    - task: PowerShell@2
      displayName: "Run Sonar Code Quality Scan"
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
      inputs:
        targetType: 'inline'
        script: |
          sonar -D sonar.host.url=http://localhost:9000 -D sonar.token=$env:SONAR_TOKEN -D sonar.projectKey=todouimonolathic

# ======================================================
# Stage 2: Build Stage
# ======================================================
- stage: Build
  displayName: "Build Application"
  dependsOn: SonarQube_Scan
  jobs:
  - job: BuildJob
    displayName: "Node Build"
    steps:

    - task: NodeTool@0
      displayName: "Install Node.js"
      inputs:
        versionSpec: '18.x'

    - task: PowerShell@2
      displayName: "npm install"
      inputs:
        targetType: 'inline'
        script: |
          npm install

    - task: PowerShell@2
      displayName: "npm run build"
      inputs:
        targetType: 'inline'
        script: |
          npm run build

# ======================================================
# Stage 3: Package & Publish
# ======================================================
- stage: Package
  displayName: "Archive & Publish Artifact"
  dependsOn: Build
  jobs:
  - job: PackageJob
    displayName: "Publish Artifact"
    steps:

    - task: ArchiveFiles@2
      displayName: "Archive build folder"
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/build'
        includeRootFolder: true
        archiveType: 'zip'
        archiveFile: '$(System.DefaultWorkingDirectory)/build.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: "Publish Artifact"
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/build.zip'
        artifact: 'todo-ui'
        publishLocation: 'pipeline'
