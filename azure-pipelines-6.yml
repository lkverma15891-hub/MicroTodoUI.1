trigger: none
   

pool:
  name: Prod_infra

stages:
- stage: SoftwareCompositionAnalysis
  displayName: Software Composition Analysis (Dependency Security)
  jobs:
    - job: 
      displayName: scanning
      steps:
      -   task:  PowerShell@2
          inputs:
            targetType: inline
            script: 'sonar -D sonar.host.url=http://localhost:9000 -D sonar.token=squ_8be945a71c91c337aae04135ede74bd7b1e1cd98 -D sonar.projectKey=todouimonolathic'
- stage: 
  displayName: code scanning
  jobs:
  - job: code_scan
    displayName: code quality scanning
    steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          pwsh: true
          script: |
            # Set SonarQube environment variables
            $env:SONAR_HOST_URL="http://localhost:9000"
            $env:SONAR_LOGIN="$(SONAR_TOKEN)"

            # Install SonarScanner globally if needed
              npm install -g sonar-scanner

            # Run scanner
              sonar-scanner -Dsonar.projectKey=apps -Dsonar.sources=. -Dsonar.projectName=apps


