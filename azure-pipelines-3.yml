    - task: PowerShell@2
      continueOnError: true
      displayName: "Lint CSS (Stylelint)"
      inputs:
        targetType: 'inline'
        script: |
          npm install -g stylelint
          npm install -g stylelint-config-standard
          stylelint "$(System.DefaultWorkingDirectory)/src" --config stylelint.config.mjs
            




# Stage 1.5: SCA Scan (Retire.js)
# ======================================================
- stage: SCA_RetireJS
  displayName: "SCA - Dependency Scan (Retire.js)"
  jobs:
    - job: RetireScan
      displayName: "Run Retire.js Scan"
      steps:

        # Install Node.js
        - task: NodeTool@0
          displayName: "Install Node.js"
          inputs:
            versionSpec: '18.x'

        # Install npm dependencies
        - task: PowerShell@2
          displayName: "Install npm dependencies"
          inputs:
            targetType: 'inline'
            script: |
              npm install

        # Install Retire.js globally
        - task: PowerShell@2
          displayName: "Install Retire.js"
          inputs:
            targetType: 'inline'
            script: |
              npm install -g retire

        # Run Retire.js scan on ./public folder
        - task: PowerShell@2
          displayName: "Run Retire.js Scan (fail on high)"
          inputs:
            targetType: 'inline'
            script: |
              retire --path ./public --outputformat json --outputpath retire-report.json --severity high --exitwith 1

        # Generate JSON report (already done in previous step, safe to keep)
        - task: PowerShell@2
          displayName: "Generate Retire.js Report"
          inputs:
            targetType: 'inline'
            script: |
              retire --path ./public --outputformat json --outputpath retire-report.json

        # Publish the report as pipeline artifact
        - task: PublishPipelineArtifact@1
          displayName: "Publish Retire.js Report"
          inputs:
            targetPath: 'retire-report.json'
            artifact: 'retirejs-report'
            publishLocation: 'pipeline'
