# ======================================================
# Stage 1.5: SCA Scan (retire.js)
# ======================================================
- stage: SCA_DependencyScan
  displayName: "SCA - Dependency Scan (npm audit)"
  jobs:
  - job: NpmAudit
    displayName: "Run npm audit"
    steps:

    - task: NodeTool@0
      displayName: "Install Node.js"
      inputs:
        versionSpec: '18.x'

    - task: PowerShell@2
      displayName: "Install npm dependencies"
      inputs:
        targetType: 'inline'
        script: |
          npm install

    - task: PowerShell@2
      displayName: "Run npm audit (fail on high)"
      inputs:
        targetType: 'inline'
        script: |
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) {
              Write-Error "High severity vulnerabilities found!"
              exit 1
          }

    - task: PowerShell@2
      displayName: "Generate npm audit report"
      inputs:
        targetType: 'inline'
        script: |
          npm audit --json > npm-audit-report.json

    - task: PublishPipelineArtifact@1
      displayName: "Publish npm audit report"
      inputs:
        targetPath: 'npm-audit-report.json'
        artifact: 'npm-audit-report'
        publishLocation: 'pipeline'
