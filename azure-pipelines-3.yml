trigger: none

pool:
  name: Prod_infra

variables:
- group: sonarqube-secrets   # SONAR_TOKEN (secret)
stages:
- stage: SAST_Scan
  displayName: "SAST - Security Scan"
  jobs:
  - job: SAST
    displayName: "Run SAST Scan"
    steps:

    - task: PowerShell@2
      displayName: "Run SAST using Sonar CLI"
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
      inputs:
        targetType: 'inline'
        script: |
          sonar -D sonar.host.url=http://localhost:9000 -D sonar.token=$env:SONAR_TOKEN -D sonar.projectKey=todouimonolathic


