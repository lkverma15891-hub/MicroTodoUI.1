apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-ui
  template:
    metadata:
      labels:
        app: todo-ui
    spec:
      containers:
      - name: todo-ui
        # image: devopsinsidersacr235.azurecr.io/todo-ui:v4
          image: loveneesh15891/movies:latest
        ports:
        - containerPort: 80
